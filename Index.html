<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BudgetBot Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentGreen: '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom padding helper for iOS home indicator bars */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1.5rem);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans pb-28">

    <!-- Top Header Bar -->
    <header class="sticky top-0 z-40 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-500/20 p-2 rounded-xl text-emerald-400 border border-emerald-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
            </div>
            <h1 class="text-lg font-bold tracking-tight text-white">BudgetBot <span class="text-xs px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-semibold border border-emerald-500/30">PRO</span></h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openAddModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-2 rounded-xl shadow-lg transition flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
            </button>
            <button onclick="exportCSV()" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Export CSV">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Container Views -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Dashboard View -->
        <section id="view-dashboard" class="space-y-4">
            <div class="bg-[#1e293b] border border-slate-800 p-5 rounded-2xl shadow-lg">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Balance</p>
                <h2 id="dash-balance" class="text-3xl font-extrabold text-white mt-1">$0.00</h2>
                <span id="dash-solvent-badge" class="inline-flex items-center mt-2 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Solvent</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#1e293b] border border-slate-800 p-4 rounded-2xl">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Total Income</p>
                    <p id="dash-income" class="text-xl font-bold text-emerald-400 mt-1">$0.00</p>
                </div>
                <div class="bg-[#1e293b] border border-slate-800 p-4 rounded-2xl">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Total Expenses</p>
                    <p id="dash-expenses" class="text-xl font-bold text-rose-400 mt-1">$0.00</p>
                </div>
            </div>

            <div class="bg-[#1e293b] border border-slate-800 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase">Savings Retention</p>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="dash-savings-rate" class="text-2xl font-bold text-white">0%</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                    <div id="dash-savings-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- Ledger View -->
        <section id="view-ledger" class="hidden space-y-3">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-lg font-bold text-white">Transaction History</h3>
                <span id="transaction-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded-lg">0 items</span>
            </div>
            <div id="transaction-list" class="space-y-2">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Budgets View -->
        <section id="view-budgets" class="hidden space-y-3">
            <h3 class="text-lg font-bold text-white mb-2">Category Budgets</h3>
            <div id="budget-categories-list" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Analytics View -->
        <section id="view-analytics" class="hidden space-y-4">
            <h3 class="text-lg font-bold text-white mb-2">Spending Breakdown</h3>
            <div class="bg-[#1e293b] border border-slate-800 p-4 rounded-2xl flex justify-center">
                <div class="w-64 h-64">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- Fixed Bottom Navigation Bar (Optimized for Mobile / iOS Safe Areas) -->
    <nav aria-label="Bottom Navigation" class="fixed bottom-0 left-0 right-0 z-50 bg-[#0f172a]/95 backdrop-blur-lg border-t border-slate-800/80 px-2 pt-2 pb-safe shadow-2xl">
        <div class="max-w-md mx-auto flex items-center justify-around">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center py-2 px-3 rounded-xl text-emerald-400 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                <span class="text-[10px] font-medium tracking-wide">Dashboard</span>
            </button>
            <button onclick="switchTab('ledger')" id="nav-ledger" class="flex flex-col items-center py-2 px-3 rounded-xl text-slate-400 hover:text-slate-200 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span class="text-[10px] font-medium tracking-wide">Ledger</span>
            </button>
            <button onclick="switchTab('budgets')" id="nav-budgets" class="flex flex-col items-center py-2 px-3 rounded-xl text-slate-400 hover:text-slate-200 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[10px] font-medium tracking-wide">Budgets</span>
            </button>
            <button onclick="switchTab('analytics')" id="nav-analytics" class="flex flex-col items-center py-2 px-3 rounded-xl text-slate-400 hover:text-slate-200 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
                <span class="text-[10px] font-medium tracking-wide">Analytics</span>
            </button>
        </div>
    </nav>

    <!-- Add Transaction Modal -->
    <div id="addModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-[#1e293b] border border-slate-800 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">New Transaction</h3>
            <form id="txForm" onsubmit="handleTxSubmit(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 font-medium">Type</label>
                    <select id="txType" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-medium">Description</label>
                    <input type="text" id="txDesc" required placeholder="e.g. Groceries" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-medium">Amount ($)</label>
                    <input type="number" step="0.01" id="txAmount" required placeholder="0.00" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-800 text-slate-300 font-medium py-3 rounded-xl hover:bg-slate-700 transition">Cancel</button>
                    <button type="submit" class="flex-1 bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl hover:bg-emerald-400 transition">Add</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('budgetbot_state')) || {
            transactions: [
                { id: 1, desc: 'Monthly Salary', amount: 5500, type: 'income' },
                { id: 2, desc: 'Rent & Utilities', amount: 1850, type: 'expense' },
                { id: 3, desc: 'Groceries', amount: 595.70, type: 'expense' }
            ]
        };

        let chartInstance = null;

        function saveState() {
            localStorage.setItem('budgetbot_state', JSON.stringify(state));
            updateUI();
        }

        function switchTab(tabId) {
            ['dashboard', 'ledger', 'budgets', 'analytics'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center py-2 px-3 rounded-xl text-slate-400 hover:text-slate-200 transition";
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "flex flex-col items-center py-2 px-3 rounded-xl text-emerald-400 transition";
            if(tabId === 'analytics') renderChart();
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

        function handleTxSubmit(e) {
            e.preventDefault();
            const desc = document.getElementById('txDesc').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const type = document.getElementById('txType').value;
            state.transactions.unshift({ id: Date.now(), desc, amount, type });
            document.getElementById('txForm').reset();
            closeAddModal();
            saveState();
        }

        function deleteTx(id) {
            state.transactions = state.transactions.filter(t => t.id !== id);
            saveState();
        }

        function updateUI() {
            let income = state.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            let expenses = state.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            let balance = income - expenses;
            let savingsRate = income > 0 ? Math.max(0, Math.round((balance / income) * 100)) : 0;

            document.getElementById('dash-balance').innerText = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-income').innerText = `$${income.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-expenses').innerText = `$${expenses.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-savings-rate').innerText = `${savingsRate}%`;
            document.getElementById('dash-savings-bar').style.width = `${Math.min(100, savingsRate)}%`;

            const listEl = document.getElementById('transaction-list');
            document.getElementById('transaction-count').innerText = `${state.transactions.length} items`;
            listEl.innerHTML = state.transactions.map(t => `
                <div class="bg-[#1e293b] border border-slate-800 p-3.5 rounded-xl flex items-center justify-between">
                    <div>
                        <p class="font-semibold text-white text-sm">${t.desc}</p>
                        <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${t.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">${t.type}</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold text-sm ${t.type === 'income' ? 'text-emerald-400' : 'text-slate-200'}">${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}</span>
                        <button onclick="deleteTx(${t.id})" class="text-slate-500 hover:text-rose-400 p-1">×</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-500 py-6 text-sm">No transactions yet.</p>';
        }

        function renderChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const expData = state.transactions.filter(t => t.type === 'expense');
            const labels = expData.map(t => t.desc);
            const data = expData.map(t => t.amount);

            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length ? labels : ['No Expenses'],
                    datasets: [{
                        data: data.length ? data : [1],
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12 } } } }
            });
        }

        function exportCSV() {
            let csv = 'ID,Description,Type,Amount\n' + state.transactions.map(t => `${t.id},"${t.desc}",${t.type},${t.amount}`).join('\n');
            let blob = new Blob([csv], { type: 'text/csv' });
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'budgetbot_export.csv');
            a.click();
        }

        updateUI();
    </script>
</body>
</html>
